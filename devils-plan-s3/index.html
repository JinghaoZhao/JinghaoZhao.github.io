<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06070b" />
    <title>The Devil's Plan S3: Dead Again · 魔鬼的计谋3 在线联机游戏合集</title>
    <meta
      name="description"
      content="Play every mind game from The Devil's Plan Season 3: Dead Again online with friends (P2P rooms), solo against smart AI, or local pass-and-play — directly in your browser."
    />
    <link rel="canonical" href="https://zhaojinghao.com/devils-plan-s3/" />
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <script src="./shared/https-guard.js"></script>
    <link rel="stylesheet" href="./shared/theme.css" />
    <link rel="stylesheet" href="./hub.css" />
  </head>
  <body class="dp-body hub-body">
    <canvas id="hub-canvas" aria-hidden="true"></canvas>
    <div class="hub-lightshaft" aria-hidden="true"></div>

    <header class="hub-topbar">
      <div class="hub-container hub-topbar-inner">
        <div class="hub-brand-group">
          <a class="hub-home-link" href="../" aria-label="Back to Jinghao Zhao homepage">
            jz<span style="color: var(--dp-brass);">.</span>
          </a>
          <span class="hub-divider" aria-hidden="true">/</span>
          <span class="hub-brand-title">DEVIL'S PLAN <span style="color: var(--dp-crimson-bright);">S3</span></span>
        </div>
        <div class="hub-topbar-actions">
          <button type="button" class="dp-btn dp-btn-sm dp-btn-ghost" id="hub-lang-btn">中 / EN</button>
          <button type="button" class="dp-btn dp-btn-icon dp-btn-ghost" id="hub-amb-btn" title="Studio Ambience">〰</button>
          <button type="button" class="dp-btn dp-btn-icon dp-btn-ghost" id="hub-mute-btn" title="Toggle Sound">🔊</button>
        </div>
      </div>
    </header>

    <main class="hub-main">
      <section class="hub-hero">
        <div class="hub-container">
          <div class="hub-eyebrow">
            <span class="dp-piece-icon" aria-hidden="true"></span>
            <span id="hub-eyebrow-text">NETFLIX · SEASON 3 ARCHIVE · PLAYABLE EDITION</span>
          </div>
          <h1 class="hub-title">
            <span class="hub-title-main">THE DEVIL'S PLAN</span>
            <span class="hub-title-sub">DEAD AGAIN</span>
          </h1>
          <p class="hub-lead" id="hub-lead-text"></p>

          <div class="hub-pillars" id="hub-pillars"></div>

          <!-- Quick Join Bar -->
          <form class="hub-quickjoin dp-panel" id="hub-quickjoin-form">
            <div class="hub-qj-label" id="hub-qj-label"></div>
            <div class="hub-qj-controls">
              <select class="dp-input" id="hub-qj-game" aria-label="Select game"></select>
              <input
                class="dp-input dp-input-mono"
                id="hub-qj-code"
                type="text"
                maxlength="6"
                placeholder="ROOM CODE"
                aria-label="Room code"
              />
              <button type="submit" class="dp-btn dp-btn-primary" id="hub-qj-submit"></button>
            </div>
          </form>
        </div>
      </section>

      <section class="hub-catalog">
        <div class="hub-container">
          <div class="hub-catalog-head">
            <div>
              <h2 class="hub-section-title" id="hub-catalog-title"></h2>
              <p class="hub-section-sub" id="hub-catalog-count"></p>
            </div>
            <div class="hub-filters" id="hub-filters" role="tablist"></div>
          </div>

          <div class="hub-grid" id="hub-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="hub-footer">
      <div class="hub-container hub-footer-inner">
        <span>
          <span class="dp-piece-icon" style="vertical-align: middle; margin-right: 6px;"></span>
          <span id="hub-footer-left"></span>
        </span>
        <a href="../" class="hub-footer-link" id="hub-footer-home"></a>
      </div>
    </footer>

    <script type="module" src="./hub.js"></script>
  </body>
</html>
