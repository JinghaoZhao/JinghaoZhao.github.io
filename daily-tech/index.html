<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="每日科技长文，按日期归档的中文阅读收藏。保留历史正文与原文链接。"><meta name="theme-color" content="#f7f6f2"><title>每日科技长文 · 阅读收藏</title><link rel="stylesheet" href="style.css"></head>
<body><div class="progress" id="progress"></div>
<header class="header"><a class="brand" href="./" aria-label="每日科技长文首页"><span class="brand-mark">阅</span><span>每日科技长文<small>DAILY / TECH</small></span></a><nav><a href="./" id="archive-link">文章归档</a><button id="theme" aria-label="切换深色阅读模式" title="切换深色阅读模式">◐</button></nav></header>
<main id="home" class="shell">
<section class="hero"><div class="eyebrow">THE READING COLLECTION</div><h1>把值得读的，<br><em>好好留下。</em></h1><p>科技与 AI 的每日长文，原文链接与中文正文。<br>从一篇文章开始，慢慢读，也随时回来。</p><div id="stats" class="stats" aria-live="polite">正在载入文章…</div></section>
<section id="featured" class="featured" hidden></section>
<section class="archive" aria-labelledby="archive-heading"><div class="archive-heading"><h2 id="archive-heading">所有文章 <span id="result-count"></span></h2><span class="micro">CHRONOLOGICAL ARCHIVE</span></div>
<div class="filters"><label class="search-wrap"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="搜索标题、主题或来源" aria-label="搜索标题、主题或来源"></label><select id="month" aria-label="按月份筛选"><option value="all">所有月份</option></select><select id="availability" aria-label="按归档状态筛选"><option value="full">已归档正文</option><option value="all">全部记录</option><option value="pending">待补正文</option></select></div>
<div class="topic-list" id="topics" aria-label="按主题筛选"></div><div id="post-list" aria-live="polite"></div><div class="more-wrap"><button id="load-more" class="outline" hidden>再看一些文章 ↓</button></div></section>
</main>
<main id="reader" class="reader-shell" hidden><a href="./" class="back" id="back">← 返回文章归档</a><div class="reading-layout"><article><div id="article-meta" class="eyebrow"></div><h1 id="article-title"></h1><div id="article-source" class="source"></div><div class="reader-tools"><span id="reading-time"></span><div><button id="font-down" aria-label="缩小正文字号">A−</button><button id="font-up" aria-label="放大正文字号">A＋</button><button id="copy-link">复制链接</button></div></div><div id="article-body" class="prose" aria-live="polite"></div><div id="article-nav" class="article-nav"></div></article><aside id="toc-box"><div class="eyebrow">本篇目录</div><nav id="toc"></nav><a class="back-top" href="#reader">回到顶部 ↑</a></aside></div></main>
<div id="error" role="alert" class="shell error" hidden></div><footer class="footer"><span>每日科技长文 <span class="footer-dot">/</span> 你的阅读收藏</span><span id="footer-meta">保留当时的文字，也保留思考的过程。</span></footer><script src="app.js" defer></script></body></html>
